<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼吃羊1</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0e6d2;
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }
        .main-flex, .side-bar { display: none; }
        .bottom-bar {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 10px;
        }
        .bottom-bar .info {
            font-size: 1.2em;
            color: #a97b50;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .bottom-bar .btn {
            min-width: 100px;
            margin: 0;
        }
        /* 移除.rules-btn和.back-menu-btn的独立样式 */
        /* .rules-btn, .back-menu-btn { ... } 及其:hover 全部移除 */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            max-width: 100%;
            margin-bottom: 20px;
        }
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }
        canvas {
            width: 100%;
            max-width: 400px;
            height: auto;
            display: block;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        #status {
            font-size: 1.2em;
            font-weight: bold;
            color: #5c3d2e;
            margin-bottom: 15px;
            min-height: 25px;
        }

        #restart-button {
            background-color: #8d6e63;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #restart-button:hover {
            background-color: #6d4c41;
        }
        .top-bar { display: none; }
        .info {
            font-size: 1.3em;
            color: #a97b50;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        /* 只保留.btn样式 */
        .btn {
            background: #e2c9a0;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            padding: 8px 18px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            transition: background 0.2s;
            min-width: 100px;
            text-align: center;
            display: inline-block;
        }
        .btn:hover {
            background: #c9a06c;
            color: #fff;
        }
        .game-rules {
            background: #fff8e1;
            border: 1.5px solid #e2c9a0;
            border-radius: 12px;
            padding: 18px 24px;
            margin-bottom: 24px;
            max-width: 500px;
            color: #6d4c41;
            font-size: 1.08em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .game-rules h2 {
            margin-top: 0;
            color: #a97b50;
            font-size: 1.25em;
            margin-bottom: 10px;
        }
        .game-rules ul {
            margin: 0 0 0 1.2em;
            padding: 0;
        }
        .game-rules li {
            margin-bottom: 6px;
        }
        .back-menu-btn {
            display: inline-block;
            margin: 18px auto 0 auto;
            background: #e2c9a0;
            color: #4a4a4a;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            padding: 10px 32px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            transition: background 0.2s, color 0.2s;
        }
        .back-menu-btn:hover {
            background: #c9a06c;
            color: #fff;
        }
        .rules-btn {
            display: inline-block;
            margin: 18px auto 0 auto;
            background: #e2c9a0;
            color: #4a4a4a;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            padding: 10px 32px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            transition: background 0.2s, color 0.2s;
        }
        .rules-btn:hover {
            background: #c9a06c;
            color: #fff;
        }
        .rules-modal-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.25);
            z-index: 1000;
            display: none;
        }
        .rules-modal-mask.active {
            display: block;
        }
        .rules-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #fff8e1;
            border: 1.5px solid #e2c9a0;
            border-radius: 16px;
            padding: 28px 32px 18px 32px;
            max-width: 90vw;
            width: 400px;
            color: #6d4c41;
            font-size: 1.08em;
            box-shadow: 0 6px 32px rgba(0,0,0,0.18);
            z-index: 1001;
            display: none;
        }
        .rules-modal.active {
            display: block;
        }
        .rules-modal h2 {
            margin-top: 0;
            color: #a97b50;
            font-size: 1.25em;
            margin-bottom: 10px;
        }
        .rules-modal ul {
            margin: 0 0 0 1.2em;
            padding: 0;
        }
        .rules-modal li {
            margin-bottom: 6px;
        }
        .close-rules-btn {
            display: block;
            margin: 18px auto 0 auto;
            background: #e2c9a0;
            color: #4a4a4a;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            padding: 8px 32px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            transition: background 0.2s, color 0.2s;
        }
        .close-rules-btn:hover {
            background: #c9a06c;
            color: #fff;
        }
        @media (max-width: 600px) {
            .game-container { padding: 8px; border-radius: 8px; }
            .bottom-bar { gap: 8px; }
            .bottom-bar .btn { min-width: 70px; font-size: 0.95em; padding: 7px 8px; }
            canvas { max-width: 98vw; width: 98vw; }
            .rules-modal { width: 95vw; padding: 10px 2vw 8px 2vw; font-size: 0.98em; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="game-board" width="400" height="570"></canvas>
    </div>
    <div class="controls-container">
        <div class="bottom-bar">
            <div class="info" id="info-bar"></div>
            <button class="btn" id="restart-button">重新开始</button>
            <button class="btn" id="show-rules-btn">游戏规则</button>
            <button class="btn" id="back-menu-btn">返回主菜单</button>
        </div>
        <div id="status"></div>
    </div>
    <div class="rules-modal-mask" id="rules-mask"></div>
    <div class="rules-modal" id="rules-modal">
        <h2>游戏说明 · 狼吃羊</h2>
        <ul>
            <li><b>狼走法：</b>共两只狼，可沿直线或斜线走一步。若沿直线跳过羊，且跳到被吃羊的下一个空位置，则可吃掉该羊。</li>
            <li><b>羊走法：</b>共23只羊，开局先放8只。之后每步将羊放在空位。放完所有羊后，可移动一只羊沿直线或斜线走一步。</li>
            <li><b>输赢判别：</b>狼先走，之后轮流。羊剩12只即判羊输；若两只狼都无法走动，则判狼输。</li>
        </ul>
        <button class="close-rules-btn" id="close-rules-btn">关闭</button>
    </div>

    <script>
    // --- 游戏主逻辑 ---
    const canvas = document.getElementById('game-board');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart-button');
    const infoBar = document.getElementById('info-bar'); // Added for new status display

    // --- 游戏配置 ---
    const BOARD_COLOR = '#c8b7a6';
    const EMPTY_COLOR = '#ddd';
    const SHEEP_COLOR = '#ffffff';
    const WOLF_COLOR = '#333333';
    const HIGHLIGHT_COLOR = 'rgba(255, 215, 0, 0.7)';
    const VALID_MOVE_COLOR = 'rgba(76, 175, 80, 0.7)';
    const PIECE_RADIUS = 20;
    const CLICK_RADIUS = 15;

    // --- 棋盘节点和连接定义 ---
    // 画布宽400, 高570
    // 上方菱形顶点y=60，底部y=120
    // 网格最上y=120，最下y=360，间隔60
    // 下方菱形顶点y=360，底部y=520
    const nodes = [
        // 上方菱形
        { id: 0, x: 200, y: 20 },    // 顶点
        { id: 1, x: 140, y: 70 },    // 左
        { id: 2, x: 200, y: 120 },   // 底（与网格最上中点重合）
        { id: 3, x: 260, y: 70 },    // 右

        // 主体4x4网格（5x5个交点，恢复id:6）
        { id: 4, x: 80,  y: 120 }, { id: 5, x: 140, y: 120 }, { id: 6, x: 200, y: 120 }, { id: 7, x: 260, y: 120 }, { id: 8, x: 320, y: 120 },
        { id: 9, x: 80,  y: 180 }, { id: 10, x: 140, y: 180 }, { id: 11, x: 200, y: 180 }, { id: 12, x: 260, y: 180 }, { id: 13, x: 320, y: 180 },
        { id: 14, x: 80,  y: 240 }, { id: 15, x: 140, y: 240 }, { id: 16, x: 200, y: 240 }, { id: 17, x: 260, y: 240 }, { id: 18, x: 320, y: 240 },
        { id: 19, x: 80,  y: 300 }, { id: 20, x: 140, y: 300 }, { id: 21, x: 200, y: 300 }, { id: 22, x: 260, y: 300 }, { id: 23, x: 320, y: 300 },
        { id: 24, x: 80,  y: 360 }, { id: 25, x: 140, y: 360 }, { id: 26, x: 200, y: 360 }, { id: 27, x: 260, y: 360 }, { id: 28, x: 320, y: 360 },

        // 下方菱形（恢复id:29）
        { id: 29, x: 200, y: 360 },   // 顶点（与网格最下中点重合）
        { id: 30, x: 140, y: 410 },   // 左
        { id: 31, x: 200, y: 460 },   // 底
        { id: 32, x: 260, y: 410 },   // 右
        { id: 33, x: 200, y: 70 },    // 上菱形交叉点
        { id: 34, x: 200, y: 410 }    // 下菱形交叉点
    ];

    const connections = [
        // 上方菱形的边和对角线
        [0, 1], [1, 2], [2, 3], [3, 0], // 四条边
        
        // 上方菱形交叉线
        [0,33], [1,33], [2,33], [3,33],

        // 下方菱形的边和对角线
        [29, 30], [30, 31], [31, 32], [32, 29], // 四条边
        // 下方菱形交叉线
        [29,34], [30,34], [31,34], [32,34],

        // 4x4网格横线（每行5个点，4条横线）
        [4,5],[5,6],[6,7],[7,8],
        [9,10],[10,11],[11,12],[12,13],
        [14,15],[15,16],[16,17],[17,18],
        [19,20],[20,21],[21,22],[22,23],
        [24,25],[25,26],[26,27],[27,28],

        // 4x4网格竖线（每列5个点，4条竖线）
        [4,9],[9,14],[14,19],[19,24],
        [5,10],[10,15],[15,20],[20,25],
        [6,11],[11,16],[16,21],[21,26],
        [7,12],[12,17],[17,22],[22,27],
        [8,13],[13,18],[18,23],[23,28],

        // 4x4大正方形主对角线
        [4, 10], [10, 16], [16, 22], [22, 28],[8,12],[12,16],[16,20],[20,24],[6,10],[2,10],[10,14],[14,20],[20,26],[20,29],[29,22],[26,22],[22,18],[18,12],[12,2],[12,6]
    ];

    // --- 预定义跳吃路线 ---
    // 格式：[from, over, to] - 从from跳过over到to
    const validJumpPaths = [
        // 上方菱形的跳吃路线
        [0, 33, 2], // 从顶点0的跳吃
        [1, 33, 3], // 从左点1的跳吃
        [2, 33, 0], // 从底点2的跳吃
        [3, 33, 1], // 从右点3的跳吃
        
        // 下方菱形的跳吃路线
        [29, 34, 31],  // 从顶点29的跳吃
        [30, 34, 32],  // 从左点30的跳吃
        [31, 34, 29],  // 从底点31的跳吃
        [32, 34, 30],  // 从右点32的跳吃
        
        // 网格内的直线跳吃路线（横线）
        [4, 5, 6], [5, 6, 7], [6, 7, 8],  // 第一行
        [9, 10, 11], [10, 11, 12], [11, 12, 13],  // 第二行
        [14, 15, 16], [15, 16, 17], [16, 17, 18],  // 第三行
        [19, 20, 21], [20, 21, 22], [21, 22, 23],  // 第四行
        [24, 25, 26], [25, 26, 27], [26, 27, 28],  // 第五行
        
        // 网格内的直线跳吃路线（竖线）
        [4, 9, 14], [9, 14, 19], [14, 19, 24],  // 第一列
        [5, 10, 15], [10, 15, 20], [15, 20, 25],  // 第二列
        [6, 11, 16], [11, 16, 21], [16, 21, 26],  // 第三列
        [7, 12, 17], [12, 17, 22], [17, 22, 27],  // 第四列
        [8, 13, 18], [13, 18, 23], [18, 23, 28],  // 第五列
        
        // 对角线跳吃路线（主对角线）
        [4, 10, 16], [10, 16, 22], [16, 22, 28],  // 左上到右下
        [8, 12, 16], [12, 16, 20], [16, 20, 24],  // 右上到左下
        [6, 10, 14], [14, 20, 26],  // 中间对角线
        [6, 12, 18],  [18, 22, 26],  // 中间对角线
        
        // 等价节点的跳吃路线（2/6和26/29）
        [1, 2, 12], [33, 2, 11], [3, 2, 10], [1, 6, 12], [33, 6, 11], [3, 6, 10],  // 2/6位置的跳吃
        [20, 29, 32], [21, 29, 34],[22,29,30], [20, 26, 32], [21, 26, 34],[22,26,30] // 26/29位置的跳吃
    ];

    // --- 游戏状态 ---
    let gameState = {};

    function setupNewGame() {
        gameState = {
            board: new Array(nodes.length).fill(0), // 0: empty, 1: sheep, 2: wolf
            turn: 'WOLF', // WOLF or SHEEP
            phase: 'PLACEMENT', // PLACEMENT or MOVEMENT
            sheepInHand: 23 - 8,
            sheepOnBoard: 8,
            sheepEaten: 0,
            selectedPieceIndex: -1,
            validMoves: [],
            gameOver: false,
            winner: null,
        };

        // Initial placement
        gameState.board[2] = 2; // 上方狼（上方菱形底部）
        gameState.board[26] = 2; // 下方狼（下方菱形顶部）

        // 羊的位置：id 10, 11, 12, 15, 17, 20, 21, 22
        const initialSheep = [10, 11, 12, 15, 17, 20, 21, 22];
        initialSheep.forEach(i => gameState.board[i] = 1);

        updateStatus();
        draw();
    }

    function drawBoard() {
        ctx.strokeStyle = BOARD_COLOR;
        ctx.lineWidth = 2;
        connections.forEach(([startId, endId]) => {
            const startNode = nodes[startId];
            const endNode = nodes[endId];
            ctx.beginPath();
            ctx.moveTo(startNode.x, startNode.y);
            ctx.lineTo(endNode.x, endNode.y);
            ctx.stroke();
        });
    }

    function drawPieces() {
        // 1. 生成物理点坐标到所有id的映射
        const coordToIds = {};
        nodes.forEach((node, i) => {
            const key = `${node.x},${node.y}`;
            if (!coordToIds[key]) coordToIds[key] = [];
            coordToIds[key].push(i);
        });
        // 2. 只画一次棋子，优先显示狼
        Object.entries(coordToIds).forEach(([key, ids]) => {
            let wolfId = ids.find(id => gameState.board[id] === 2);
            let sheepId = ids.find(id => gameState.board[id] === 1);
            let node = nodes[ids[0]];
            if (wolfId !== undefined) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(node.x, node.y, 20, 0, 2 * Math.PI);
                // 狼行动时，未选中为红色，选中为绿色
                if (gameState.turn === 'WOLF') {
                    if (
                        wolfId !== undefined &&
                        getAllEquivalentIndices(wolfId).includes(gameState.selectedPieceIndex)
                    ) {
                        ctx.fillStyle = '#4caf50'; // 绿色
                    } else {
                        ctx.fillStyle = '#e53935'; // 红色
                    }
                } else {
                    ctx.fillStyle = '#f7e3b2'; // 默认色
                }
                ctx.shadowColor = 'rgba(0,0,0,0.10)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#a97b50';
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 20px serif';
                ctx.fillStyle = '#222';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('狼', node.x, node.y+2);
                ctx.restore();
            } else if (sheepId !== undefined) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(node.x, node.y, 20, 0, 2 * Math.PI);
                ctx.fillStyle = '#f7e3b2';
                ctx.shadowColor = 'rgba(0,0,0,0.10)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#a97b50';
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 20px serif';
                ctx.fillStyle = '#3d2b1f';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('羊', node.x, node.y+2);
                ctx.restore();
            }
        });
    }

    function drawHighlights() {
        // Highlight selected piece
        if (gameState.selectedPieceIndex !== -1) {
            const node = nodes[gameState.selectedPieceIndex];
            ctx.beginPath();
            ctx.arc(node.x, node.y, PIECE_RADIUS + 2, 0, 2 * Math.PI);
            ctx.fillStyle = HIGHLIGHT_COLOR;
            ctx.fill();
        }
        // Highlight valid moves
        gameState.validMoves.forEach(move => {
            const node = nodes[move.to];
            ctx.beginPath();
            ctx.arc(node.x, node.y, PIECE_RADIUS, 0, 2 * Math.PI);
            ctx.fillStyle = VALID_MOVE_COLOR;
            ctx.fill();
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBoard();
        drawHighlights(); // Draw highlights under pieces
        drawPieces();
    }

    function getNeighbors(nodeIndex) {
        let neighbors = [];
        connections.forEach(([start, end]) => {
            if (start === nodeIndex) neighbors.push(end);
            if (end === nodeIndex) neighbors.push(start);
        });
        // 合并重合点邻居
        if (nodeIndex === 2) {
            connections.forEach(([start, end]) => {
                if (start === 6) neighbors.push(end);
                if (end === 6) neighbors.push(start);
            });
        }
        if (nodeIndex === 6) {
            connections.forEach(([start, end]) => {
                if (start === 2) neighbors.push(end);
                if (end === 2) neighbors.push(start);
            });
        }
        if (nodeIndex === 26) {
            connections.forEach(([start, end]) => {
                if (start === 29) neighbors.push(end);
                if (end === 29) neighbors.push(start);
            });
        }
        if (nodeIndex === 29) {
            connections.forEach(([start, end]) => {
                if (start === 26) neighbors.push(end);
                if (end === 26) neighbors.push(start);
            });
        }
        return [...new Set(neighbors)]; // Return unique neighbors
    }

    function getAllEquivalentIndices(idx) {
        if (idx === 2) return [2, 6];
        if (idx === 6) return [2, 6];
        if (idx === 26) return [26, 29];
        if (idx === 29) return [26, 29];
        return [idx];
    }

    function calculateValidMoves(pieceIndex) {
        const pieceType = gameState.board[pieceIndex];
        const moves = [];
        // 合并所有等价点的邻居（单步走和跳吃一致）
        let neighbors = [];
        getAllEquivalentIndices(pieceIndex).forEach(idx => {
            neighbors = neighbors.concat(getNeighbors(idx));
        });
        neighbors = [...new Set(neighbors)];

        if (pieceType === 1) { // Sheep movement
            neighbors.forEach(neighbor => {
                if (gameState.board[neighbor] === 0) {
                    moves.push({ to: neighbor, type: 'MOVE' });
                }
            });
        } else if (pieceType === 2) { // Wolf movement
            console.log(`检查狼在位置${pieceIndex}的移动路线...`);
            neighbors.forEach(neighbor => {
                if (gameState.board[neighbor] === 0) {
                    console.log(`狼可以从${pieceIndex}移动到${neighbor}`);
                    moves.push({ to: neighbor, type: 'MOVE' });
                } else if (gameState.board[neighbor] === 1) {
                    // 检查跳吃：neighbor为over
                    const over = neighbor;
                    let overNeighbors = getNeighbors(over);
                    overNeighbors = [...new Set(overNeighbors)];
                    overNeighbors.forEach(jumpTo => {
                        // 检查是否是通过重合点进行的不合理跳吃
                        const isInvalidJump = (
                            (getAllEquivalentIndices(pieceIndex).includes(2) || getAllEquivalentIndices(pieceIndex).includes(6)) &&
                            over === 7 && 
                            (getAllEquivalentIndices(jumpTo).includes(2) || getAllEquivalentIndices(jumpTo).includes(6))
                        ) || (
                            (getAllEquivalentIndices(pieceIndex).includes(26) || getAllEquivalentIndices(pieceIndex).includes(29)) &&
                            over === 27 && 
                            (getAllEquivalentIndices(jumpTo).includes(26) || getAllEquivalentIndices(jumpTo).includes(29))
                        );
                        
                        // 首先检查基本跳吃条件
                        const basicJumpValid = (
                            jumpTo !== pieceIndex &&
                            gameState.board[jumpTo] === 0 &&
                            gameState.board[over] === 1 &&
                            !isInvalidJump
                        );
                        
                        // 然后检查是否在预定义的跳吃路径中
                        const pathValid = validJumpPaths.some(path => {
                            const [a, b, c] = path;
                            const condition1 = getAllEquivalentIndices(pieceIndex).includes(a) && over === b && getAllEquivalentIndices(jumpTo).includes(c);
                            const condition2 = getAllEquivalentIndices(jumpTo).includes(a) && over === b && getAllEquivalentIndices(pieceIndex).includes(c);
                            console.log(`[路径验证] 路径[${a},${b},${c}]:`, {
                                pieceIndex,
                                over,
                                jumpTo,
                                eqFrom: getAllEquivalentIndices(pieceIndex),
                                eqTo: getAllEquivalentIndices(jumpTo),
                                condition1,
                                condition2,
                                result: condition1 || condition2
                            });
                            return condition1 || condition2;
                        });
                        
                        const isValidJump = basicJumpValid && pathValid;
                        
                        console.log(`[跳吃基本条件] 从${pieceIndex}跳过${over}到${jumpTo}:`, {
                            basicJumpValid,
                            pathValid,
                            finalValid: isValidJump,
                            overPiece: gameState.board[over],
                            toPiece: gameState.board[jumpTo],
                            overIsSheep: gameState.board[over] === 1,
                            toIsEmpty: gameState.board[jumpTo] === 0,
                            notSamePosition: jumpTo !== pieceIndex,
                            notInvalidJump: !isInvalidJump
                        });
                        // 调试输出 - 始终显示
                        console.log('[跳吃判定]', {
                            from: pieceIndex,
                            over,
                            to: jumpTo,
                            fromNeighbors: getNeighbors(pieceIndex),
                            overNeighbors: overNeighbors,
                            board: [...gameState.board],
                            valid: isValidJump,
                            invalidReason: isInvalidJump ? '通过重合点不合理跳吃' : '正常'
                        });
                        if (isValidJump) {
                            console.log(`狼可以从${pieceIndex}跳过${over}到${jumpTo}`);
                            moves.push({ to: jumpTo, type: 'JUMP', jumped: over });
                        }
                    });
                }
            });
        }
        console.log(`位置${pieceIndex}的总可走路线:`, moves);
        return moves;
    }

    function getJumpNode(fromNodeIndex, overNodeIndex) {
        const fromNode = nodes[fromNodeIndex];
        const overNode = nodes[overNodeIndex];
        const dx = overNode.x - fromNode.x;
        const dy = overNode.y - fromNode.y;
        const targetX = overNode.x + dx;
        const targetY = overNode.y + dy;

        const targetNodeIndex = nodes.findIndex(n => n.x === targetX && n.y === targetY);

        // Ensure the jump is along a valid connection line
        if (targetNodeIndex !== -1) {
             const overNeighbors = getNeighbors(overNodeIndex);
             if(overNeighbors.includes(targetNodeIndex)){
                 return targetNodeIndex;
             }
        }
        return -1;
    }

    function checkWinConditions() {
        // Wolf win condition
        if (gameState.sheepEaten >= 11) { // 23 - 12 = 11 sheep eaten
            gameState.gameOver = true;
            gameState.winner = 'WOLF';
            return;
        }

        // Sheep win condition - 狼无路可走
        if (!checkWolfCanMove()) {
            gameState.gameOver = true;
            gameState.winner = 'SHEEP';
            return;
        }
    }

    function updateStatus() {
        // 信息栏显示剩下的羊和当前回合
        let sheepLeft = gameState.sheepInHand + gameState.sheepOnBoard;
        let turnText = gameState.turn === 'WOLF' ? '请狼走' : '请羊走';
        infoBar.textContent = `未下的羊：${gameState.sheepInHand}  |  ${turnText}`;
        // 原有状态栏保留胜负提示
        if (gameState.gameOver) {
            statusEl.textContent = gameState.winner === 'WOLF' ? '狼获胜！' : '羊获胜！';
        } else {
            statusEl.textContent = '';
        }
    }

    function checkWolfCanMove() {
        console.log('检查狼是否有路可走...');
        let wolfPositions = [];
        
        // 找到所有狼的位置
        for (let i = 0; i < gameState.board.length; i++) {
            if (gameState.board[i] === 2) {
                wolfPositions.push(i);
            }
        }
        
        console.log('狼的位置:', wolfPositions);
        
        // 检查每只狼是否有路可走
        for (let wolfPos of wolfPositions) {
            const moves = calculateValidMoves(wolfPos);
            console.log(`狼在位置${wolfPos}的可走路线:`, moves);
            if (moves.length > 0) {
                console.log('狼有路可走');
                return true;
            }
        }
        
        console.log('所有狼都无路可走！');
        return false;
    }

    function handleCanvasClick(event) {
        if (gameState.gameOver) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (event.clientX - rect.left) * scaleX;
        const y = (event.clientY - rect.top) * scaleY;

        const clickedNodeIndex = nodes.findIndex(node =>
            Math.sqrt((node.x - x) ** 2 + (node.y - y) ** 2) < CLICK_RADIUS
        );

        if (clickedNodeIndex === -1) return;

        const { turn, phase } = gameState;

        const eqIndices = getAllEquivalentIndices(clickedNodeIndex);
        console.log('点击的节点:', clickedNodeIndex, '等价集合:', eqIndices);

        if (turn === 'SHEEP') {
            if (phase === 'PLACEMENT') {
                if (gameState.board[clickedNodeIndex] === 0) {
                    gameState.board[clickedNodeIndex] = 1;
                    gameState.sheepInHand--;
                    gameState.sheepOnBoard++;
                    if (gameState.sheepInHand === 0) {
                        gameState.phase = 'MOVEMENT';
                    }
                    gameState.turn = 'WOLF';
                    // 强制检查狼是否有路可走
                    if (!checkWolfCanMove()) {
                        gameState.gameOver = true;
                        gameState.winner = 'SHEEP';
                        console.log('游戏结束：狼无路可走，羊获胜！');
                    }
                    checkWinConditions();
                }
            } else { // MOVEMENT phase
                if (
                    eqIndices.some(idx => gameState.board[idx] === 1) &&
                    gameState.selectedPieceIndex !== clickedNodeIndex
                ) {
                    const realIdx = eqIndices.find(idx => gameState.board[idx] === 1);
                    gameState.selectedPieceIndex = realIdx;
                    gameState.validMoves = calculateValidMoves(realIdx);
                } else {
                    handlePieceMovement(clickedNodeIndex, 1, 'WOLF');
                }
            }
        } else if (turn === 'WOLF') {
            // 强制检查狼是否有路可走
            if (!checkWolfCanMove()) {
                gameState.gameOver = true;
                gameState.winner = 'SHEEP';
                console.log('游戏结束：狼无路可走，羊获胜！');
                updateStatus();
                draw();
                return;
            }
            if (
                eqIndices.some(idx => gameState.board[idx] === 2) &&
                gameState.selectedPieceIndex !== clickedNodeIndex
            ) {
                const realIdx = eqIndices.find(idx => gameState.board[idx] === 2);
                gameState.selectedPieceIndex = realIdx;
                gameState.validMoves = calculateValidMoves(realIdx);
            } else {
                handlePieceMovement(clickedNodeIndex, 2, 'SHEEP');
            }
        }

        updateStatus();
        draw();
    }

    function handlePieceMovement(clickedIndex, pieceType, nextTurn) {
        // 归一化：如果点击的是等价点集合，找到实际有棋子的 index（选中）或空位 index（移动）
        const eqIndices = getAllEquivalentIndices(clickedIndex);
        let realClickedIndex = clickedIndex;
        if (gameState.selectedPieceIndex === -1) {
            // 选中阶段，找有棋子的 index
            const found = eqIndices.find(idx => gameState.board[idx] === pieceType);
            if (found !== undefined) realClickedIndex = found;
        } else {
            // 移动阶段，找空位
            const found = eqIndices.find(idx => gameState.board[idx] === 0);
            if (found !== undefined) realClickedIndex = found;
        }

        // 选中棋子
        if (gameState.board[realClickedIndex] === pieceType && gameState.selectedPieceIndex !== realClickedIndex) {
            gameState.selectedPieceIndex = realClickedIndex;
            gameState.validMoves = calculateValidMoves(realClickedIndex);
        }
        // 取消选中
        else if (gameState.selectedPieceIndex === realClickedIndex) {
            gameState.selectedPieceIndex = -1;
            gameState.validMoves = [];
        }
        // 移动/跳吃
        else if (gameState.selectedPieceIndex !== -1) {
            // 目标点也要归一化：允许点击等价集合内任意点
            const move = gameState.validMoves.find(m => getAllEquivalentIndices(m.to).includes(realClickedIndex));
            if (move) {
                // 清理所有等价点
                const allEq = Array.from(new Set([
                    ...getAllEquivalentIndices(move.to),
                    ...getAllEquivalentIndices(gameState.selectedPieceIndex)
                ]));
                allEq.forEach(idx => {
                    gameState.board[idx] = 0;
                });
                // 只在目标点赋值
                gameState.board[move.to] = pieceType;

                if (move.type === 'JUMP') {
                    getAllEquivalentIndices(move.jumped).forEach(idx => {
                        if (gameState.board[idx] === 1) {
                            gameState.board[idx] = 0;
                            gameState.sheepEaten++;
                            gameState.sheepOnBoard--;
                        }
                    });
                }

                // Reset selection and switch turn
                gameState.selectedPieceIndex = -1;
                gameState.validMoves = [];
                gameState.turn = nextTurn;

                // 新增：切换到狼回合时，若狼无路可走直接判负
                if (nextTurn === 'WOLF' && !checkWolfCanMove()) {
                    gameState.gameOver = true;
                    gameState.winner = 'SHEEP';
                }
                // After the move, check for win conditions
                checkWinConditions();
            }
        }
    }



    // --- Event Listeners ---
    canvas.addEventListener('click', handleCanvasClick);
    restartBtn.addEventListener('click', setupNewGame);

    // 游戏规则弹窗逻辑
    document.getElementById('show-rules-btn').onclick = function() {
        document.getElementById('rules-modal').classList.add('active');
        document.getElementById('rules-mask').classList.add('active');
    };
    document.getElementById('close-rules-btn').onclick = function() {
        document.getElementById('rules-modal').classList.remove('active');
        document.getElementById('rules-mask').classList.remove('active');
    };
    document.getElementById('rules-mask').onclick = function() {
        document.getElementById('rules-modal').classList.remove('active');
        document.getElementById('rules-mask').classList.remove('active');
    };

    // 返回主菜单按钮事件
    document.getElementById('back-menu-btn').onclick = function() {
        window.location.href = 'index.html';
    };

    // --- Initial Game Start ---
    setupNewGame();
    </script>
