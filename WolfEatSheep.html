<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼吃羊1</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0e6d2;
            color: #4a4a4a;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            /* 用 min-height 而非 height，内容超高时页面可正常滚动，不会被裁掉顶部 */
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .main-flex, .side-bar { display: none; }
        .bottom-bar {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 10px;
        }
        .bottom-bar .info {
            font-size: 1.2em;
            color: #a97b50;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .bottom-bar .btn {
            min-width: 100px;
            margin: 0;
        }
        /* 移除.rules-btn和.back-menu-btn的独立样式 */
        /* .rules-btn, .back-menu-btn { ... } 及其:hover 全部移除 */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 424px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        canvas {
            /* 实际显示尺寸由 JS 的 fitCanvas() 计算写入 style，避免 CSS 缩放导致错位 */
            display: block;
            touch-action: manipulation;
            /* 禁用移动端点击时的系统高亮方块：
               该方块出现在手指点击处，易被误认为"可走位置"提示 */
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        #status {
            font-size: 1.2em;
            font-weight: bold;
            color: #5c3d2e;
            margin-bottom: 15px;
            min-height: 25px;
        }

        #restart-button {
            background-color: #8d6e63;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #restart-button:hover {
            background-color: #6d4c41;
        }
        .top-bar { display: none; }
        .info {
            font-size: 1.3em;
            color: #a97b50;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        /* 只保留.btn样式 */
        .btn {
            background: #e2c9a0;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            padding: 8px 18px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            transition: background 0.2s;
            min-width: 100px;
            text-align: center;
            display: inline-block;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            touch-action: manipulation;
        }
        .btn:hover {
            background: #c9a06c;
            color: #fff;
        }
        .game-rules {
            background: #fff8e1;
            border: 1.5px solid #e2c9a0;
            border-radius: 12px;
            padding: 18px 24px;
            margin-bottom: 24px;
            max-width: 500px;
            color: #6d4c41;
            font-size: 1.08em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .game-rules h2 {
            margin-top: 0;
            color: #a97b50;
            font-size: 1.25em;
            margin-bottom: 10px;
        }
        .game-rules ul {
            margin: 0 0 0 1.2em;
            padding: 0;
        }
        .game-rules li {
            margin-bottom: 6px;
        }
        .back-menu-btn {
            display: inline-block;
            margin: 18px auto 0 auto;
            background: #e2c9a0;
            color: #4a4a4a;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            padding: 10px 32px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            transition: background 0.2s, color 0.2s;
        }
        .back-menu-btn:hover {
            background: #c9a06c;
            color: #fff;
        }
        .rules-btn {
            display: inline-block;
            margin: 18px auto 0 auto;
            background: #e2c9a0;
            color: #4a4a4a;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            padding: 10px 32px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            transition: background 0.2s, color 0.2s;
        }
        .rules-btn:hover {
            background: #c9a06c;
            color: #fff;
        }
        .rules-modal-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.25);
            z-index: 1000;
            display: none;
        }
        .rules-modal-mask.active {
            display: block;
        }
        .rules-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #fff8e1;
            border: 1.5px solid #e2c9a0;
            border-radius: 16px;
            padding: 28px 32px 18px 32px;
            max-width: 90vw;
            width: 400px;
            color: #6d4c41;
            font-size: 1.08em;
            box-shadow: 0 6px 32px rgba(0,0,0,0.18);
            z-index: 1001;
            display: none;
        }
        .rules-modal.active {
            display: block;
        }
        .rules-modal h2 {
            margin-top: 0;
            color: #a97b50;
            font-size: 1.25em;
            margin-bottom: 10px;
        }
        .rules-modal ul {
            margin: 0 0 0 1.2em;
            padding: 0;
        }
        .rules-modal li {
            margin-bottom: 6px;
        }
        .close-rules-btn {
            display: block;
            margin: 18px auto 0 auto;
            background: #e2c9a0;
            color: #4a4a4a;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            padding: 8px 32px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            transition: background 0.2s, color 0.2s;
        }
        .close-rules-btn:hover {
            background: #c9a06c;
            color: #fff;
        }
        @media (max-width: 600px) {
            .game-container { padding: 8px; border-radius: 8px; margin-bottom: 10px; }
            .bottom-bar { gap: 8px; flex-wrap: wrap; }
            .bottom-bar .info { width: 100%; text-align: center; font-size: 1.05em; }
            .bottom-bar .btn { min-width: 64px; font-size: 0.9em; padding: 8px 6px; }
            .rules-modal { width: 95vw; max-width: 95vw; padding: 14px 16px 10px 16px; font-size: 0.95em; }
            .rules-modal ul, .game-rules ul { margin-left: 1em; }
        }
        /* 短屏（横屏手机）：进一步压缩留白，保证棋盘完整可见 */
        @media (max-height: 480px) and (orientation: landscape) {
            .game-container { padding: 6px; margin-bottom: 6px; }
            .bottom-bar { margin-bottom: 4px; gap: 6px; }
            .btn, .bottom-bar .btn { padding: 6px 10px; font-size: 0.85em; }
            #status { font-size: 1em; min-height: 18px; margin-bottom: 6px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="game-board" width="400" height="570"></canvas>
    </div>
    <div class="controls-container">
        <div class="bottom-bar">
            <div class="info" id="info-bar"></div>
            <button class="btn" id="restart-button">重新开始</button>
            <button class="btn" id="show-rules-btn">游戏规则</button>
            <button class="btn" id="back-menu-btn">返回主菜单</button>
        </div>
        <div id="status"></div>
    </div>
    <div class="rules-modal-mask" id="rules-mask"></div>
    <div class="rules-modal" id="rules-modal">
        <h2>游戏说明 · 狼吃羊</h2>
        <ul>
            <li><b>狼走法：</b>共两只狼，可沿直线或斜线走一步。若沿直线跳过羊，且跳到被吃羊的下一个空位置，则可吃掉该羊。</li>
            <li><b>羊走法：</b>共23只羊，开局先放8只。之后每步将羊放在空位。放完所有羊后，可移动一只羊沿直线或斜线走一步。</li>
            <li><b>输赢判别：</b>狼先走，之后轮流。羊剩12只即判羊输；若两只狼都无法走动，则判狼输。</li>
        </ul>
        <button class="close-rules-btn" id="close-rules-btn">关闭</button>
    </div>

    <script>
    // --- 游戏主逻辑 ---
    const canvas = document.getElementById('game-board');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart-button');
    const infoBar = document.getElementById('info-bar'); // Added for new status display

    // --- 游戏配置 ---
    const BOARD_COLOR = '#c8b7a6';
    const EMPTY_COLOR = '#ddd';
    const SHEEP_COLOR = '#ffffff';
    const WOLF_COLOR = '#333333';
    const HIGHLIGHT_COLOR = 'rgba(255, 215, 0, 0.7)';
    const VALID_MOVE_COLOR = 'rgba(76, 175, 80, 0.7)';
    const PIECE_RADIUS = 20;
    const CLICK_RADIUS = 15;

    // --- 画布自适应 ---
    // 棋盘逻辑坐标固定为 400 x 570，显示尺寸按可用空间等比缩放，
    // 内部缓冲区按 devicePixelRatio 放大，保证手机屏幕上不模糊、不错位。
    const LOGIC_W = 400;
    const LOGIC_H = 570;

    function fitCanvas() {
        const container = canvas.parentElement;
        const styles = getComputedStyle(container);
        const padX = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
        const padY = parseFloat(styles.paddingTop) + parseFloat(styles.paddingBottom);

        // 可用宽度只依据视口计算，不读取容器宽度，
        // 否则容器被写死宽度后再次测量会读到自身收窄的值，导致逐次缩小。
        const bodyStyles = getComputedStyle(document.body);
        const pageAvailW = window.innerWidth
            - parseFloat(bodyStyles.paddingLeft) - parseFloat(bodyStyles.paddingRight);

        // 竖向可用空间 = 视口高 - 底部操作区 - 容器外边距 - 安全留白
        const controlsH = document.querySelector('.controls-container').offsetHeight;
        const containerMargin = parseFloat(getComputedStyle(container).marginBottom) || 0;
        const availH = window.innerHeight - controlsH - containerMargin - padY - 24;

        const scale = Math.max(
            0.3,
            Math.min(pageAvailW - padX, LOGIC_W, Math.max(availH, 240)) / LOGIC_W
        );
        const cssW = Math.floor(LOGIC_W * scale);
        const cssH = Math.floor(LOGIC_H * scale);

        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        // 容器宽度贴合画布，避免内部出现多余留白
        container.style.width = (cssW + padX) + 'px';
        container.style.maxWidth = 'none';

        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        const bufW = Math.round(LOGIC_W * dpr);
        const bufH = Math.round(LOGIC_H * dpr);
        if (canvas.width !== bufW || canvas.height !== bufH) {
            canvas.width = bufW;
            canvas.height = bufH;
            // 重设缓冲后变换矩阵会重置，必须重新应用缩放
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // --- 棋盘节点和连接定义 ---
    // 画布宽400, 高570
    // 上方菱形顶点y=60，底部y=120
    // 网格最上y=120，最下y=360，间隔60
    // 下方菱形顶点y=360，底部y=520
    const nodes = [
        // 上方菱形
        { id: 0, x: 200, y: 20 },    // 顶点
        { id: 1, x: 140, y: 70 },    // 左
        { id: 2, x: 200, y: 120 },   // 底（与网格最上中点重合）
        { id: 3, x: 260, y: 70 },    // 右

        // 主体4x4网格（5x5个交点，恢复id:6）
        { id: 4, x: 80,  y: 120 }, { id: 5, x: 140, y: 120 }, { id: 6, x: 200, y: 120 }, { id: 7, x: 260, y: 120 }, { id: 8, x: 320, y: 120 },
        { id: 9, x: 80,  y: 180 }, { id: 10, x: 140, y: 180 }, { id: 11, x: 200, y: 180 }, { id: 12, x: 260, y: 180 }, { id: 13, x: 320, y: 180 },
        { id: 14, x: 80,  y: 240 }, { id: 15, x: 140, y: 240 }, { id: 16, x: 200, y: 240 }, { id: 17, x: 260, y: 240 }, { id: 18, x: 320, y: 240 },
        { id: 19, x: 80,  y: 300 }, { id: 20, x: 140, y: 300 }, { id: 21, x: 200, y: 300 }, { id: 22, x: 260, y: 300 }, { id: 23, x: 320, y: 300 },
        { id: 24, x: 80,  y: 360 }, { id: 25, x: 140, y: 360 }, { id: 26, x: 200, y: 360 }, { id: 27, x: 260, y: 360 }, { id: 28, x: 320, y: 360 },

        // 下方菱形（恢复id:29）
        { id: 29, x: 200, y: 360 },   // 顶点（与网格最下中点重合）
        { id: 30, x: 140, y: 410 },   // 左
        { id: 31, x: 200, y: 460 },   // 底
        { id: 32, x: 260, y: 410 },   // 右
        { id: 33, x: 200, y: 70 },    // 上菱形交叉点
        { id: 34, x: 200, y: 410 }    // 下菱形交叉点
    ];

    const connections = [
        // 上方菱形的边和对角线
        [0, 1], [1, 2], [2, 3], [3, 0], // 四条边
        // 菱形中心连线：中心(33)是真实棋位，狼可跳过它吃对角线另一端的羊
        [0,33], [1,33], [2,33], [3,33],

        // 下方菱形的边和对角线
        [29, 30], [30, 31], [31, 32], [32, 29], // 四条边
        // 下方菱形中心连线：中心(34)是真实棋位
        [29,34], [30,34], [31,34], [32,34],

        // 4x4网格横线（每行5个点，4条横线）
        [4,5],[5,6],[6,7],[7,8],
        [9,10],[10,11],[11,12],[12,13],
        [14,15],[15,16],[16,17],[17,18],
        [19,20],[20,21],[21,22],[22,23],
        [24,25],[25,26],[26,27],[27,28],

        // 4x4网格竖线（每列5个点，4条竖线）
        [4,9],[9,14],[14,19],[19,24],
        [5,10],[10,15],[15,20],[20,25],
        [6,11],[11,16],[16,21],[21,26],
        [7,12],[12,17],[17,22],[22,27],
        [8,13],[13,18],[18,23],[23,28],

        // 4x4大正方形主对角线
        [4, 10], [10, 16], [16, 22], [22, 28],[8,12],[12,16],[16,20],[20,24],[6,10],[2,10],[10,14],[14,20],[20,26],[20,29],[29,22],[26,22],[22,18],[18,12],[12,2],[12,6]
    ];

    // --- 预定义跳吃路线 ---
    // 格式：[from, over, to] - 从from跳过over到to
    const validJumpPaths = [
        // 上方菱形的跳吃路线（经中心33）
        [0, 33, 2], // 从顶点0的跳吃
        [1, 33, 3], // 从左点1的跳吃
        [2, 33, 0], // 从底点2的跳吃
        [3, 33, 1], // 从右点3的跳吃

        // 下方菱形的跳吃路线（经中心34）
        [29, 34, 31],  // 从顶点29的跳吃
        [30, 34, 32],  // 从左点30的跳吃
        [31, 34, 29],  // 从底点31的跳吃
        [32, 34, 30],  // 从右点32的跳吃
        
        // 网格内的直线跳吃路线（横线）
        [4, 5, 6], [5, 6, 7], [6, 7, 8],  // 第一行
        [9, 10, 11], [10, 11, 12], [11, 12, 13],  // 第二行
        [14, 15, 16], [15, 16, 17], [16, 17, 18],  // 第三行
        [19, 20, 21], [20, 21, 22], [21, 22, 23],  // 第四行
        [24, 25, 26], [25, 26, 27], [26, 27, 28],  // 第五行
        
        // 网格内的直线跳吃路线（竖线）
        [4, 9, 14], [9, 14, 19], [14, 19, 24],  // 第一列
        [5, 10, 15], [10, 15, 20], [15, 20, 25],  // 第二列
        [6, 11, 16], [11, 16, 21], [16, 21, 26],  // 第三列
        [7, 12, 17], [12, 17, 22], [17, 22, 27],  // 第四列
        [8, 13, 18], [13, 18, 23], [18, 23, 28],  // 第五列
        
        // 对角线跳吃路线（主对角线）
        [4, 10, 16], [10, 16, 22], [16, 22, 28],  // 左上到右下
        [8, 12, 16], [12, 16, 20], [16, 20, 24],  // 右上到左下
        [6, 10, 14], [14, 20, 26],  // 中间对角线
        [6, 12, 18],  [18, 22, 26],  // 中间对角线
        
        // 等价节点的跳吃路线（2/6和26/29）
        [1, 2, 12], [33, 2, 11], [3, 2, 10], [1, 6, 12], [33, 6, 11], [3, 6, 10],  // 2/6位置的跳吃
        [20, 29, 32], [21, 29, 34], [22,29,30], [20, 26, 32], [21, 26, 34], [22,26,30] // 26/29位置的跳吃
    ];

    // --- 游戏状态 ---
    let gameState = {};

    function setupNewGame() {
        gameState = {
            board: new Array(nodes.length).fill(0), // 0: empty, 1: sheep, 2: wolf
            turn: 'WOLF', // WOLF or SHEEP
            phase: 'PLACEMENT', // PLACEMENT or MOVEMENT
            sheepInHand: 23 - 8,
            sheepOnBoard: 8,
            sheepEaten: 0,
            selectedPieceIndex: -1,
            validMoves: [],
            gameOver: false,
            winner: null,
        };

        // Initial placement
        gameState.board[2] = 2; // 上方狼（上方菱形底部）
        gameState.board[26] = 2; // 下方狼（下方菱形顶部）

        // 羊的位置：id 10, 11, 12, 15, 17, 20, 21, 22
        const initialSheep = [10, 11, 12, 15, 17, 20, 21, 22];
        initialSheep.forEach(i => gameState.board[i] = 1);

        updateStatus();
        draw();
    }

    function drawBoard() {
        ctx.strokeStyle = BOARD_COLOR;
        ctx.lineWidth = 2;
        connections.forEach(([startId, endId]) => {
            const startNode = nodes[startId];
            const endNode = nodes[endId];
            ctx.beginPath();
            ctx.moveTo(startNode.x, startNode.y);
            ctx.lineTo(endNode.x, endNode.y);
            ctx.stroke();
        });
    }

    function drawPieces() {
        // 1. 生成物理点坐标到所有id的映射
        const coordToIds = {};
        nodes.forEach((node, i) => {
            const key = `${node.x},${node.y}`;
            if (!coordToIds[key]) coordToIds[key] = [];
            coordToIds[key].push(i);
        });
        // 2. 只画一次棋子，优先显示狼
        Object.entries(coordToIds).forEach(([key, ids]) => {
            let wolfId = ids.find(id => gameState.board[id] === 2);
            let sheepId = ids.find(id => gameState.board[id] === 1);
            let node = nodes[ids[0]];
            if (wolfId !== undefined) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(node.x, node.y, 20, 0, 2 * Math.PI);
                // 狼行动时，未选中为红色，选中为绿色
                if (gameState.turn === 'WOLF') {
                    if (
                        wolfId !== undefined &&
                        equivalentsOf(wolfId).includes(gameState.selectedPieceIndex)
                    ) {
                        ctx.fillStyle = '#4caf50'; // 绿色
                    } else {
                        ctx.fillStyle = '#e53935'; // 红色
                    }
                } else {
                    ctx.fillStyle = '#f7e3b2'; // 默认色
                }
                ctx.shadowColor = 'rgba(0,0,0,0.10)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#a97b50';
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 20px serif';
                ctx.fillStyle = '#222';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('狼', node.x, node.y+2);
                ctx.restore();
            } else if (sheepId !== undefined) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(node.x, node.y, 20, 0, 2 * Math.PI);
                ctx.fillStyle = '#f7e3b2';
                ctx.shadowColor = 'rgba(0,0,0,0.10)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#a97b50';
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 20px serif';
                ctx.fillStyle = '#3d2b1f';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('羊', node.x, node.y+2);
                ctx.restore();
            }
        });
    }

    function drawHighlights() {
        // Highlight selected piece
        if (gameState.selectedPieceIndex !== -1) {
            const node = nodes[gameState.selectedPieceIndex];
            ctx.beginPath();
            ctx.arc(node.x, node.y, PIECE_RADIUS + 2, 0, 2 * Math.PI);
            ctx.fillStyle = HIGHLIGHT_COLOR;
            ctx.fill();
        }
        // Highlight valid moves
        gameState.validMoves.forEach(move => {
            const node = nodes[move.to];
            ctx.beginPath();
            ctx.arc(node.x, node.y, PIECE_RADIUS, 0, 2 * Math.PI);
            ctx.fillStyle = VALID_MOVE_COLOR;
            ctx.fill();
        });
    }

    function draw() {
        ctx.clearRect(0, 0, LOGIC_W, LOGIC_H);
        drawBoard();
        drawHighlights(); // Draw highlights under pieces
        drawPieces();
    }

    // --- 重合点处理（自动推导，无需手工维护等价对） ---
    // 本棋盘存在"两个节点ID 指向同一物理位置"的情况：
    //   节点2 与节点6 坐标相同(200,120)，节点26 与节点29 相同(200,360)
    // 它们是菱形顶点与网格中点的重合点。这里按坐标自动分组，
    // 以后若再增加重合节点，无需修改任何判定逻辑。
    const POS_GROUPS = (() => {
        const byXY = new Map();
        nodes.forEach((n, i) => {
            const key = `${n.x},${n.y}`;
            if (!byXY.has(key)) byXY.set(key, []);
            byXY.get(key).push(i);
        });
        // 节点ID -> 该位置上的所有节点ID
        const byPos = new Map();
        byXY.forEach(ids => ids.forEach(id => byPos.set(id, ids)));
        return byPos;
    })();

    // --- 邻接表：同一物理位置上的所有连线合并在一起 ---
    // 棋盘连线只声明一次；重合点会自动并集，无需为 2/6、26/29 写死 if 分支。
    const ADJACENCY = (() => {
        const adj = {};
        connections.forEach(([a, b]) => {
            (adj[a] ??= new Set()).add(b);
            (adj[b] ??= new Set()).add(a);
        });
        // 按位置合并：位置P的邻居 = 其所有节点邻居所在位置的代表节点
        const byPos = {};
        for (const nodeIdStr of Object.keys(adj)) {
            const nodeId = Number(nodeIdStr);
            const eq = POS_GROUPS.get(nodeId);
            if (!byPos[nodeId]) byPos[nodeId] = new Set();
            adj[nodeIdStr].forEach(nb => {
                // 邻居若也是重合点，取该位置的代表节点，保证去重
                byPos[nodeId].add(nb);
            });
            eq.forEach(alias => {
                if (alias !== nodeId && adj[alias]) {
                    adj[alias].forEach(nb => byPos[nodeId].add(nb));
                }
            });
        }
        return byPos;
    })();

    function getNeighbors(nodeIndex) {
        return [...(ADJACENCY[nodeIndex] ?? new Set())];
    }

    // 返回与 nodeIndex 占据同一物理位置的全部节点ID
    function equivalentsOf(nodeIndex) {
        return POS_GROUPS.get(nodeIndex) ?? [nodeIndex];
    }

    // 读取某位置的棋子：重合点可能只登记在其中一个槽位，
    // 因此必须取整个等价集合中非空的那个，否则会误判为"空位"。
    function pieceAt(nodeIndex) {
        const eq = equivalentsOf(nodeIndex);
        for (const i of eq) {
            if (gameState.board[i] !== 0) return gameState.board[i];
        }
        return 0;
    }

    // 规范化：把任意节点ID替换为该位置上真实登记棋子的那个ID；
    // 若整个位置为空，则返回用于落子的ID
    function normalizeIndex(nodeIndex, wantPiece) {
        const eq = equivalentsOf(nodeIndex);
        if (wantPiece) {
            for (const i of eq) {
                if (gameState.board[i] !== 0) return i;
            }
            return eq[0];
        }
        return pieceAt(nodeIndex) === 0 ? nodeIndex : eq[0];
    }

    // 清空一个物理位置上的所有棋子（重合点可能分布在多个槽位）
    function clearPosition(nodeIndex) {
        equivalentsOf(nodeIndex).forEach(i => { gameState.board[i] = 0; });
    }

    // 在物理位置上放置棋子（不覆盖已有棋子）
    function placePiece(nodeIndex, piece) {
        const eq = equivalentsOf(nodeIndex);
        // 优先复用已有槽位，否则落到第一个
        let slot = eq.find(i => gameState.board[i] !== 0);
        if (slot === undefined) slot = eq[0];
        clearPosition(nodeIndex);
        gameState.board[slot] = piece;
        return slot;
    }

    function calculateValidMoves(pieceIndex) {
        const pieceType = pieceAt(pieceIndex);
        const moves = [];
        // 合并所有等价点的邻居（单步走和跳吃一致）
        let neighbors = [];
        equivalentsOf(pieceIndex).forEach(idx => {
            neighbors = neighbors.concat(getNeighbors(idx));
        });
        neighbors = [...new Set(neighbors)];

        if (pieceType === 1) { // Sheep movement
            neighbors.forEach(neighbor => {
                if (pieceAt(neighbor) === 0) {
                    moves.push({ to: neighbor, type: 'MOVE' });
                }
            });
        } else if (pieceType === 2) { // Wolf movement
            neighbors.forEach(neighbor => {
                if (pieceAt(neighbor) === 0) {
                    moves.push({ to: neighbor, type: 'MOVE' });
                } else if (pieceAt(neighbor) === 1) {
                    // 检查跳吃：neighbor为over
                    const over = neighbor;
                    let overNeighbors = getNeighbors(over);
                    overNeighbors = [...new Set(overNeighbors)];
                    overNeighbors.forEach(jumpTo => {
                        // 检查是否通过重合点进行的不合理跳吃：
                        // 从重合位置起跳、跳过网格边上的点、又落回同一重合位置，
                        // 等于"原地不动"，不算有效吃子。
                        const samePos = (a, b) => equivalentsOf(a).includes(b);
                        const isInvalidJump = (
                            over === 7 && samePos(pieceIndex, jumpTo)
                        ) || (
                            over === 27 && samePos(pieceIndex, jumpTo)
                        );

                        // 首先检查基本跳吃条件
                        const basicJumpValid = (
                            !samePos(pieceIndex, jumpTo) &&
                            pieceAt(jumpTo) === 0 &&
                            pieceAt(over) === 1 &&
                            !isInvalidJump
                        );
                        
                        // 然后检查是否在预定义的跳吃路径中
                        // 比较时对重合点做等价匹配，避免因槽位不同而漏判
                        const pathValid = validJumpPaths.some(path => {
                            const [a, b, c] = path;
                            const overEq = equivalentsOf(b);
                            const condition1 = equivalentsOf(pieceIndex).includes(a) && overEq.includes(over) && equivalentsOf(jumpTo).includes(c);
                            const condition2 = equivalentsOf(jumpTo).includes(a) && overEq.includes(over) && equivalentsOf(pieceIndex).includes(c);
                            return condition1 || condition2;
                        });

                        const isValidJump = basicJumpValid && pathValid;

                        if (isValidJump) {
                            moves.push({ to: jumpTo, type: 'JUMP', jumped: over });
                        }
                    });
                }
            });
        }
        return moves;
    }

    function getJumpNode(fromNodeIndex, overNodeIndex) {
        const fromNode = nodes[fromNodeIndex];
        const overNode = nodes[overNodeIndex];
        const dx = overNode.x - fromNode.x;
        const dy = overNode.y - fromNode.y;
        const targetX = overNode.x + dx;
        const targetY = overNode.y + dy;

        const targetNodeIndex = nodes.findIndex(n => n.x === targetX && n.y === targetY);

        // Ensure the jump is along a valid connection line
        if (targetNodeIndex !== -1) {
             const overNeighbors = getNeighbors(overNodeIndex);
             if(overNeighbors.includes(targetNodeIndex)){
                 return targetNodeIndex;
             }
        }
        return -1;
    }

    function checkWinConditions() {
        // Wolf win condition
        if (gameState.sheepEaten >= 11) { // 23 - 12 = 11 sheep eaten
            gameState.gameOver = true;
            gameState.winner = 'WOLF';
            return;
        }

        // Sheep win condition - 狼无路可走
        if (!checkWolfCanMove()) {
            gameState.gameOver = true;
            gameState.winner = 'SHEEP';
            return;
        }
    }

    function updateStatus() {
        // 信息栏显示剩下的羊和当前回合
        let sheepLeft = gameState.sheepInHand + gameState.sheepOnBoard;
        let turnText = gameState.turn === 'WOLF' ? '请狼走' : '请羊走';
        infoBar.textContent = `未下的羊：${gameState.sheepInHand}  |  ${turnText}`;
        // 原有状态栏保留胜负提示
        if (gameState.gameOver) {
            statusEl.textContent = gameState.winner === 'WOLF' ? '狼获胜！' : '羊获胜！';
        } else {
            statusEl.textContent = '';
        }
    }

    function checkWolfCanMove() {
        let wolfPositions = [];

        // 找到所有狼的位置
        for (let i = 0; i < gameState.board.length; i++) {
            if (gameState.board[i] === 2) {
                wolfPositions.push(i);
            }
        }

        // 没有任何狼视为无路可走
        if (wolfPositions.length === 0) return false;

        // 检查每只狼是否有路可走（移动或吃子都算）
        // 判定标准：两只狼都无法移动且无法吃子时，判羊获胜。
        // 菱形窝内的移动同样是合法走法，不得排除。
        for (let wolfPos of wolfPositions) {
            if (calculateValidMoves(wolfPos).length > 0) {
                return true;
            }
        }

        return false;
    }

    function handleCanvasClick(event) {
        if (gameState.gameOver) return;

        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        // canvas.width 已按 devicePixelRatio 放大，此处换算回逻辑坐标
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (event.clientX - rect.left) * scaleX;
        const y = (event.clientY - rect.top) * scaleY;

        const clickedNodeIndex = nodes.findIndex(node =>
            Math.sqrt((node.x - x) ** 2 + (node.y - y) ** 2) < CLICK_RADIUS
        );

        if (clickedNodeIndex === -1) return;

        const { turn, phase } = gameState;

        const eqIndices = equivalentsOf(clickedNodeIndex);

        if (turn === 'SHEEP') {
            if (phase === 'PLACEMENT') {
                // 用 pieceAt 判定，避免同一物理位置被重复放羊
                if (pieceAt(clickedNodeIndex) === 0) {
                    placePiece(clickedNodeIndex, 1);
                    gameState.sheepInHand--;
                    gameState.sheepOnBoard++;
                    if (gameState.sheepInHand === 0) {
                        gameState.phase = 'MOVEMENT';
                    }
                    gameState.turn = 'WOLF';
                    // 强制检查狼是否有路可走
                    if (!checkWolfCanMove()) {
                        gameState.gameOver = true;
                        gameState.winner = 'SHEEP';
                    }
                    checkWinConditions();
                }
            } else { // MOVEMENT phase
                if (
                    eqIndices.some(idx => gameState.board[idx] === 1) &&
                    gameState.selectedPieceIndex !== clickedNodeIndex
                ) {
                    const realIdx = eqIndices.find(idx => gameState.board[idx] === 1);
                    gameState.selectedPieceIndex = realIdx;
                    gameState.validMoves = calculateValidMoves(realIdx);
                } else {
                    handlePieceMovement(clickedNodeIndex, 1, 'WOLF');
                }
            }
        } else if (turn === 'WOLF') {
            // 强制检查狼是否有路可走
            if (!checkWolfCanMove()) {
                gameState.gameOver = true;
                gameState.winner = 'SHEEP';
                updateStatus();
                draw();
                return;
            }
            if (
                eqIndices.some(idx => gameState.board[idx] === 2) &&
                gameState.selectedPieceIndex !== clickedNodeIndex
            ) {
                const realIdx = eqIndices.find(idx => gameState.board[idx] === 2);
                gameState.selectedPieceIndex = realIdx;
                gameState.validMoves = calculateValidMoves(realIdx);
            } else {
                handlePieceMovement(clickedNodeIndex, 2, 'SHEEP');
            }
        }

        updateStatus();
        draw();
    }

    function handlePieceMovement(clickedIndex, pieceType, nextTurn) {
        // 归一化到该物理位置上真实登记棋子的槽位（重合点可能有多个ID）
        const realClickedIndex = normalizeIndex(clickedIndex, gameState.selectedPieceIndex === -1);

        // 选中棋子
        if (pieceAt(realClickedIndex) === pieceType && gameState.selectedPieceIndex !== realClickedIndex) {
            gameState.selectedPieceIndex = realClickedIndex;
            gameState.validMoves = calculateValidMoves(realClickedIndex);
        }
        // 取消选中
        else if (gameState.selectedPieceIndex === realClickedIndex) {
            gameState.selectedPieceIndex = -1;
            gameState.validMoves = [];
        }
        // 移动/跳吃
        else if (gameState.selectedPieceIndex !== -1) {
            // 目标点也要归一化：允许点击同一物理位置上的任意节点ID
            const move = gameState.validMoves.find(m => equivalentsOf(m.to).includes(realClickedIndex));
            if (move) {
                // 清空起点与终点的整个物理位置，再落到终点
                clearPosition(gameState.selectedPieceIndex);
                clearPosition(move.to);
                placePiece(move.to, pieceType);

                if (move.type === 'JUMP' && pieceAt(move.jumped) === 1) {
                    clearPosition(move.jumped);
                    gameState.sheepEaten++;
                    gameState.sheepOnBoard--;
                }

                // Reset selection and switch turn
                gameState.selectedPieceIndex = -1;
                gameState.validMoves = [];
                gameState.turn = nextTurn;

                // 新增：切换到狼回合时，若狼无路可走直接判负
                if (nextTurn === 'WOLF' && !checkWolfCanMove()) {
                    gameState.gameOver = true;
                    gameState.winner = 'SHEEP';
                }
                // After the move, check for win conditions
                checkWinConditions();
            }
        }
    }



    // --- Event Listeners ---
    // pointerdown 统一处理鼠标与触摸，移动端无 300ms 延迟，点击位置也更精确
    if (window.PointerEvent) {
        canvas.addEventListener('pointerdown', handleCanvasClick);
    } else {
        canvas.addEventListener('touchstart', handleCanvasClick, { passive: true });
        canvas.addEventListener('mousedown', handleCanvasClick);
    }
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    restartBtn.addEventListener('click', setupNewGame);

    // 游戏规则弹窗逻辑
    document.getElementById('show-rules-btn').onclick = function() {
        document.getElementById('rules-modal').classList.add('active');
        document.getElementById('rules-mask').classList.add('active');
    };
    document.getElementById('close-rules-btn').onclick = function() {
        document.getElementById('rules-modal').classList.remove('active');
        document.getElementById('rules-mask').classList.remove('active');
    };
    document.getElementById('rules-mask').onclick = function() {
        document.getElementById('rules-modal').classList.remove('active');
        document.getElementById('rules-mask').classList.remove('active');
    };

    // 返回主菜单按钮事件
    document.getElementById('back-menu-btn').onclick = function() {
        window.location.href = 'index.html';
    };

    // --- Initial Game Start ---
    fitCanvas();
    setupNewGame();

    // 视口尺寸/方向变化时重算画布显示尺寸
    let resizeTimer = null;
    function handleResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            fitCanvas();
            draw();
        }, 100);
    }
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', handleResize);
    }
    // 字体/布局加载完成后再次校准，防止首屏尺寸偏差
    window.addEventListener('load', handleResize);
    </script>
</body>
